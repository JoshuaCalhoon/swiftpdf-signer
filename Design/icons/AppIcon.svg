<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background: Swift orange (#F05138 from swift.org). iOS applies its own squircle mask at runtime, so background is full-bleed. -->
  <rect width="1024" height="1024" fill="#F05138"/>

  <!-- Paper: white rounded rectangle -->
  <rect x="222" y="172" width="560" height="720" rx="36" fill="#FFFFFF"/>

  <!-- "SIGN" word mark — Heavy/Black weight, centered on paper, tight tracking for impact -->
  <text x="502" y="570"
        text-anchor="middle"
        font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="200"
        fill="#1F2937"
        letter-spacing="-4">SIGN</text>

  <!-- Signature line under the word mark -->
  <rect x="282" y="720" width="440" height="8" rx="4" fill="#94A3B8"/>
</svg>
