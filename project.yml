name: SwiftPDF
options:
  bundleIdPrefix: com.bar-all
  deploymentTarget:
    iOS: "18.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Local.xcconfig
  Release: Configuration/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox.git
    from: "10.2.4"

targets:
  "SwiftPDF Signer":
    type: application
    platform: iOS
    deploymentTarget: "18.6"
    sources:
      - path: Sources
    dependencies:
      - package: SwiftyDropbox
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_MACCATALYST: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.bar-all.swiftpdf
        PRODUCT_MODULE_NAME: SwiftPDF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: SwiftPDF-Info.plist
      properties:
        CFBundleDisplayName: SwiftPDF Signer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DropboxAppKey: $(DROPBOX_APP_KEY)
        NSFaceIDUsageDescription: Confirms a manager is present before returning to the template library or disconnecting Dropbox. The customer signing on this iPad should never be able to trigger these actions.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.bar-all.swiftpdf.dropbox
            CFBundleURLSchemes:
              - db-$(DROPBOX_APP_KEY)
        LSApplicationQueriesSchemes:
          - dbapi-2
          - dbapi-8-emm

  "SwiftPDF SignerTests":
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.6"
    sources:
      - path: Tests
    dependencies:
      - target: "SwiftPDF Signer"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.bar-all.swiftpdf.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  SwiftPDF Signer:
    build:
      targets:
        "SwiftPDF Signer": all
        "SwiftPDF SignerTests": [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - "SwiftPDF SignerTests"
    archive:
      config: Release
