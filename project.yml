name: SwiftPDF
options:
  bundleIdPrefix: com.kwikship
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Local.xcconfig
  Release: Configuration/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox.git
    from: "10.2.4"

targets:
  SwiftPDF:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      - package: SwiftyDropbox
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.kwikship.swiftpdf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: SwiftPDF-Info.plist
      properties:
        CFBundleDisplayName: SwiftPDF
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DropboxAppKey: $(DROPBOX_APP_KEY)
        NSFaceIDUsageDescription: Confirms a manager is present before returning to the template library or disconnecting Dropbox. The customer signing on this iPad should never be able to trigger these actions.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.kwikship.swiftpdf.dropbox
            CFBundleURLSchemes:
              - db-$(DROPBOX_APP_KEY)
        LSApplicationQueriesSchemes:
          - dbapi-2
          - dbapi-8-emm

schemes:
  SwiftPDF:
    build:
      targets:
        SwiftPDF: all
    run:
      config: Debug
    archive:
      config: Release
